<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>词汇练习 · Vocab Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="topnav">
  <a class="brand" href="index.html">
    <span class="brand-mark">词</span>
    <span class="brand-text">Vocab Practice</span>
  </a>
  <div class="nav-links">
    <a href="index.html" data-nav="home">Home</a>
    <a href="flashcards.html" data-nav="flashcards">Flashcards</a>
    <a href="game.html" data-nav="game">Game</a>
    <a href="fillblank.html" data-nav="fillblank">Fill Blank</a>
  </div>
</nav>

<main>
  <div class="hero">
    <div class="hero-text">
      <h1 class="cjk">词汇练习</h1>
      <p>40 words for the S2 Chinese EOY exam. Hit start to jump straight in, or pick your words first below.</p>
    </div>
    <div class="seal-badge">
      <div class="num" id="selectedCount">40</div>
      <div class="label">selected</div>
    </div>
  </div>

  <div class="start-block">
    <a class="pill-btn primary start-btn" id="startLink" href="flashcards.html">Start</a>
    <div class="mode-toggle" id="modeToggle">
      <button class="mode-opt active" data-page="flashcards.html">Flashcards</button>
      <button class="mode-opt" data-page="game.html">Game</button>
      <button class="mode-opt" data-page="fillblank.html">Fill Blank</button>
    </div>
  </div>

  <div class="select-controls" id="quickSelect">
    <button class="pill-btn" data-range="1-10">1–10</button>
    <button class="pill-btn" data-range="11-20">11–20</button>
    <button class="pill-btn" data-range="21-30">21–30</button>
    <button class="pill-btn" data-range="31-40">31–40</button>
    <button class="pill-btn" data-action="random10">Random 10</button>
    <button class="pill-btn" data-action="all">Select all</button>
    <button class="pill-btn ghost" data-action="clear">Clear</button>
  </div>

  <div class="list-meta">
    <span>Tap a word to include it</span>
    <span id="totalCount">40 words</span>
  </div>

  <div class="paper-panel" id="vocabList"></div>
</main>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/home.js"></script>
</body>
</html>
