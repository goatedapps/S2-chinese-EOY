vocab:
  - chinese: 沮丧
    pinyin: jǔ sàng
    meaning: "discouraged; depressed"
    confusables: [丧失, 阻丧]
    examples:
      - "虽然比赛输了，他感到十分沮丧，但还是决定继续努力。"
      - "考试成绩不理想，她感到很沮丧。"
      - "听到比赛取消的消息，队员们都很沮丧。"
      - "他找了很久还是找不到工作，因此感到十分沮丧。"
      - "不要因为一次失败就沮丧，我们还可以再试一次。"

  - chinese: 身材
    pinyin: shēn cái
    meaning: "body figure; physique"
    confusables: [身份, 材料, 身世]
    examples:
      - "姐姐经常运动，因此保持着健康匀称的身材。"
      - "她每天坚持跑步，希望保持苗条的身材。"
      - "这件衣服很适合你的身材。"
      - "运动员通常都有强健的身材。"
      - "他虽然个子不高，但是身材很结实。"

  - chinese: 心旷神怡
    pinyin: xīn kuàng shén yí
    meaning: "relaxed and refreshed"
    confusables: [心惊胆战, 心神不宁, 心不在焉]
    examples:
      - "站在山顶欣赏美丽的风景，令人感到心旷神怡。"
      - "周末到海边散步，让我感到心旷神怡。"
      - "清晨的公园空气清新，令人心旷神怡。"
      - "坐在湖边欣赏平静的湖水，我觉得心旷神怡。"
      - "放假时到乡下住几天，远离城市的喧闹，让人心旷神怡。"

  - chinese: 隐约
    pinyin: yǐn yuē
    meaning: "faintly; vaguely"
    confusables: [隐藏, 隐瞒, 约定]
    examples:
      - "透过浓雾，我隐约看见远处有一座高楼。"
      - "我隐约听见有人在门外说话。"
      - "夜色中，远处隐约出现了几盏灯。"
      - "他隐约记得小时候曾经来过这里。"
      - "乌云后面隐约可以看见月亮。"

  - chinese: 变迁
    pinyin: biàn qiān
    meaning: "changes; transition"
    confusables: [迁移, 搬迁, 变故]
    examples:
      - "随着时代的变迁，人们的生活方式也发生了很大的改变。"
      - "这座城市经历了几十年的变迁，面貌已经完全不同了。"
      - "爷爷常常和我们分享社会变迁带来的变化。"
      - "科技的发展带来了巨大的社会变迁。"
      - "从老照片中，我们可以看到家乡的变迁。"

  - chinese: 彻底
    pinyin: chè dǐ
    meaning: "thoroughly; completely"
    confusables: [透彻, 完整]
    examples:
      - "为了解决问题，我们必须彻底找出事情发生的原因。"
      - "工人把房间彻底打扫了一遍。"
      - "经过几个小时的清理，垃圾终于被彻底清除。"
      - "医生建议他彻底休息几天，不要马上工作。"
      - "我们必须彻底检查所有设备，确保没有问题。"

  - chinese: 驰名
    pinyin: chí míng
    meaning: "famous; renowned"
    confusables: [驰骋, 著名]
    examples:
      - "新加坡以干净整洁的城市环境驰名世界。"
      - "这家餐厅以传统美食驰名全国。"
      - "这座古城因其悠久的历史而驰名海外。"
      - "这所学校在音乐教育方面驰名国内外。"
      - "这位厨师制作的甜点驰名当地。"

  - chinese: 恐怖
    pinyin: kǒng bù
    meaning: "terrifying; horrible"
    confusables: [恐怕, 恐龙]
    examples:
      - "那部电影的情节太恐怖了，弟弟看了一半就不敢继续看。"
      - "昨晚的雷雨声听起来非常恐怖。"
      - "黑暗的森林里传来奇怪的声音，让人觉得很恐怖。"
      - "那个恐怖故事把小孩子吓得不敢一个人睡觉。"
      - "火灾发生时，现场的情况十分恐怖。"

  - chinese: 自卑
    pinyin: zì bēi
    meaning: "feel inferior; inferiority"
    confusables: [卑鄙, 自私]
    examples:
      - "他以前因为成绩不好而感到自卑，后来在老师的鼓励下变得更有信心。"
      - "不要因为自己的外表而感到自卑。"
      - "她以前不敢在大家面前讲话，因为觉得自己很自卑。"
      - "父母应该鼓励孩子，而不是让孩子产生自卑感。"
      - "经过不断练习，他克服了自卑，敢于在台上表演。"

  - chinese: 温馨
    pinyin: wēn xīn
    meaning: "warm; heart-warming"
    confusables: [温习, 温度, 馨香]
    examples:
      - "一家人围在桌旁吃晚餐，形成了一幅温馨的画面。"
      - "生日会上，朋友们为她准备了一个温馨的惊喜。"
      - "这间小屋虽然不大，却给人一种温馨的感觉。"
      - "妈妈的一句关心的话让我觉得十分温馨。"
      - "圣诞节时，全家一起装饰房子，气氛非常温馨。"

  - chinese: 诱惑
    pinyin: yòu huò
    meaning: "temptation; entice"
    confusables: [疑惑, 引导, 诱人]
    examples:
      - "面对网络游戏的诱惑，我们必须懂得控制自己的时间。"
      - "美食的诱惑让他忍不住多吃了一块蛋糕。"
      - "面对金钱的诱惑，他仍然坚持做正确的事。"
      - "手机游戏对孩子来说是很大的诱惑。"
      - "虽然商店打折的诱惑很大，她还是决定不买不需要的东西。"

  - chinese: 毅力
    pinyin: yì lì
    meaning: "perseverance; willpower"
    confusables: [毅然, 力气, 权力]
    examples:
      - "学习一门新的语言需要耐心和毅力，不能轻易放弃。"
      - "他靠着坚定的毅力完成了长跑比赛。"
      - "减肥需要毅力，不能因为几天没有效果就放弃。"
      - "经过多年的努力和毅力，她终于实现了自己的梦想。"
      - "只要有毅力，即使遇到困难也能坚持下去。"

  - chinese: 抗拒
    pinyin: kàng jù
    meaning: "resist; reject"
    confusables: [抵抗, 抗议, 对抗]
    examples:
      - "起初他很抗拒参加活动，但后来发现活动其实很有意义。"
      - "小孩子有时会抗拒吃自己不喜欢的食物。"
      - "她一开始抗拒改变，但后来慢慢接受了新的生活方式。"
      - "不要抗拒别人的善意帮助。"
      - "他对新科技并不抗拒，反而愿意尝试使用。"

  - chinese: 符合
    pinyin: fú hé
    meaning: "conform to; meet"
    confusables: [符号, 整合, 混合]
    examples:
      - "这项建议符合大多数居民的需求，因此获得大家支持。"
      - "这间房子的设计符合我们的要求。"
      - "他的成绩符合申请这所学校的条件。"
      - "这份报告的内容符合老师规定的格式。"
      - "这件衣服的尺寸符合我的身材。"

  - chinese: 鲜艳
    pinyin: xiān yàn
    meaning: "bright-coloured; vivid"
    confusables: [新鲜, 鲜美]
    examples:
      - "花园里开满了颜色鲜艳的花朵，吸引了许多游客。"
      - "她穿了一件鲜艳的红色裙子。"
      - "孩子们用鲜艳的颜色画了一幅画。"
      - "墙上挂着一幅色彩鲜艳的风景画。"
      - "这种花的颜色非常鲜艳，在绿色的叶子中十分显眼。"

  - chinese: 恐惧
    pinyin: kǒng jù
    meaning: "fear; dread"
    confusables: [恐怖, 恐怕]
    examples:
      - "面对困难时，我们不能因为恐惧失败而停止尝试。"
      - "小女孩第一次坐飞机时，心里充满了恐惧。"
      - "他对黑暗有一种强烈的恐惧。"
      - "听到巨大的爆炸声，人们感到十分恐惧。"
      - "她努力克服对公开演讲的恐惧。"

  - chinese: 委婉
    pinyin: wěi wǎn
    meaning: "tactful; indirect"
    confusables: [委屈, 委托, 弯曲]
    examples:
      - "老师用委婉的语气指出我的错误，让我更容易接受意见。"
      - "她没有直接拒绝朋友，而是委婉地说明自己的困难。"
      - "如果不同意别人的意见，可以用比较委婉的方式表达。"
      - "爸爸委婉地提醒弟弟不要在公共场所大声说话。"
      - "他用委婉的话告诉客人聚会快要结束了。"

  - chinese: 模糊
    pinyin: mó hu
    meaning: "blurry; vague"
    confusables: [模仿, 糊涂]
    examples:
      - "由于照片年代久远，里面人物的样子已经十分模糊。"
      - "玻璃上有很多水汽，使窗外的景物变得模糊。"
      - "这张照片太模糊了，我看不清照片里的人。"
      - "他的记忆已经很模糊，想不起当时发生了什么。"
      - "大雾使远处的建筑物看起来十分模糊。"

  - chinese: 嘈杂
    pinyin: cáo zá
    meaning: "noisy"
    confusables: [喧哗, 复杂]
    examples:
      - "食堂在午休时间十分嘈杂，我们几乎听不清彼此说话。"
      - "街上的汽车喇叭声非常嘈杂。"
      - "图书馆应该保持安静，不能让环境变得嘈杂。"
      - "由于周围太嘈杂，我无法集中精神学习。"
      - "机场候机大厅十分嘈杂，到处都是人声。"

  - chinese: 走廊
    pinyin: zǒu láng
    meaning: "corridor"
    confusables: [走路, 画廊]
    examples:
      - "下课后，许多学生在走廊上聊天，老师提醒大家不要挡住通道。"
      - "教室外的走廊很宽，可以让很多人同时通过。"
      - "我在走廊里遇到了我的老师。"
      - "请不要在走廊上奔跑，以免撞到别人。"
      - "晚上，学校的走廊显得特别安静。"

  - chinese: 姿势
    pinyin: zī shì
    meaning: "posture; position"
    confusables: [势力, 姿色, 形势]
    examples:
      - "长时间使用电脑时，我们应该保持正确的姿势，以免身体不适。"
      - "老师提醒学生坐着的时候要保持正确的姿势。"
      - "他的睡觉姿势很奇怪。"
      - "拍照时，她摆出了一个可爱的姿势。"
      - "运动员在做动作时必须保持正确的姿势。"

  - chinese: 社交媒体
    pinyin: shè jiāo méi tǐ
    meaning: "social media"
    confusables: [社会媒体, 社交礼仪, 社区活动]
    examples:
      - "社交媒体虽然方便我们交流，但我们也要小心保护个人资料。"
      - "很多年轻人每天都会使用社交媒体与朋友联系。"
      - "这家公司通过社交媒体宣传新产品。"
      - "他喜欢在社交媒体上分享旅行照片。"
      - "使用社交媒体时，我们不应该随意公开自己的个人信息。"

  - chinese: 缺陷
    pinyin: quē xiàn
    meaning: "defect; flaw"
    confusables: [缺乏, 缺席, 陷阱]
    examples:
      - "每个人都有自己的优点和缺陷，我们应该学会接受自己。"
      - "工程师发现机器有一个严重的缺陷。"
      - "这件产品虽然价格便宜，但是存在一些设计上的缺陷。"
      - "经过检查，工厂发现这批产品有质量缺陷。"
      - "他知道自己的缺陷，所以一直努力改进自己。"

  - chinese: 嫌
    pinyin: xián
    meaning: "dislike; complain about"
    confusables: [赚, 谦, 兼]
    examples:
      - "他从不嫌家里的条件普通，反而十分珍惜父母的付出。"
      - "妹妹嫌这件衣服太旧，不愿意穿。"
      - "弟弟嫌饭菜不够辣，又要求妈妈加辣椒。"
      - "他嫌房间太小，所以决定搬到更大的房子。"
      - "不要总是嫌别人做得不够好，要学会欣赏他们的努力。"

  - chinese: 简陋
    pinyin: jiǎn lòu
    meaning: "simple and crude; poorly equipped"
    confusables: [简称, 陋习, 简介]
    examples:
      - "虽然这间小屋十分简陋，但一家人仍然生活得很快乐。"
      - "他们住在一间设备简陋的小房子里。"
      - "山区学校的教室比较简陋，缺少很多教学设备。"
      - "这家餐厅的装修很简陋，但是食物非常美味。"
      - "工地上的工人暂时住在简陋的宿舍里。"

  - chinese: 政府
    pinyin: zhèng fǔ
    meaning: "government"
    confusables: [政治, 政党, 财政]
    examples:
      - "政府推出了多项环保措施，鼓励公众减少使用塑料制品。"
      - "政府正在建设新的公共交通设施。"
      - "政府鼓励市民节约用水和用电。"
      - "政府为低收入家庭提供了一些援助。"
      - "政府宣布将改善当地的医疗服务。"

  - chinese: 经济
    pinyin: jīng jì
    meaning: "economy; economic"
    confusables: [经验, 经典]
    examples:
      - "旅游业的发展能够为国家带来经济收益和更多就业机会。"
      - "这项政策有助于促进当地经济发展。"
      - "经济困难时，人们通常会减少不必要的消费。"
      - "这座城市的经济主要依靠旅游业。"
      - "良好的教育对一个国家的经济发展非常重要。"

  - chinese: 接纳
    pinyin: jiē nà
    meaning: "accept; embrace"
    confusables: [纳税, 交纳, 接壤]
    examples:
      - "我们应该学会接纳与自己不同的人，并尊重彼此的差异。"
      - "新同学刚来到班上，大家都应该主动接纳他。"
      - "一个好的团队应该接纳不同的意见。"
      - "经过一段时间，她终于接纳了自己的不足。"
      - "父母应该让孩子知道，无论发生什么，他们都会接纳孩子。"

  - chinese: 障碍
    pinyin: zhàng ài
    meaning: "obstacle; barrier"
    confusables: [故障, 阻止]
    examples:
      - "只要愿意努力，困难就不一定会成为我们前进的障碍。"
      - "语言障碍使他们很难进行沟通。"
      - "资金不足成为这个计划发展的主要障碍。"
      - "他克服了重重障碍，终于完成了比赛。"
      - "缺乏信心有时会成为实现梦想的障碍。"

  - chinese: 荣誉
    pinyin: róng yù
    meaning: "honour; glory"
    confusables: [荣华, 繁荣]
    examples:
      - "能够代表学校参加全国比赛，对他来说是一项极大的荣誉。"
      - "获得这个奖项是她一生中最大的荣誉之一。"
      - "运动员为国家赢得了荣誉。"
      - "他把这份荣誉归功于一直支持他的家人和老师。"
      - "能够帮助别人是一种荣誉，而不是负担。"

  - chinese: 接触
    pinyin: jiē chù
    meaning: "come into contact with"
    confusables: [触摸, 触动, 接壤]
    examples:
      - "通过阅读不同类型的书籍，我们可以接触到更多新的知识。"
      - "来到新学校后，我有机会接触来自不同国家的同学。"
      - "孩子从小接触音乐，有助于培养兴趣。"
      - "这份工作让我接触到许多不同的人。"
      - "学生应该多接触大自然，了解环境的重要性。"

  - chinese: 欣赏
    pinyin: xīn shǎng
    meaning: "appreciate; admire"
    confusables: [欣喜, 赏赐, 欣然]
    examples:
      - "我们不但要懂得欣赏别人的优点，也要从中学习。"
      - "游客来到这里欣赏美丽的风景。"
      - "我很欣赏他的认真和努力。"
      - "晚上，我们一起欣赏了一场精彩的音乐会。"
      - "她喜欢坐在窗边欣赏夕阳。"

  - chinese: 茁壮
    pinyin: zhuó zhuàng
    meaning: "grow vigorously; thrive"
    confusables: [壮观, 壮丽]
    examples:
      - "在老师和父母的关爱下，孩子们健康茁壮地成长。"
      - "这些小树在充足的阳光下茁壮成长。"
      - "农民细心照顾庄稼，希望它们能够茁壮生长。"
      - "在良好的环境中，孩子更容易茁壮成长。"
      - "经过几个月的照顾，花园里的植物都长得十分茁壮。"

  - chinese: 同甘共苦
    pinyin: tóng gān gòng kǔ
    meaning: "share joys and hardships"
    confusables: [同床异梦, 同流合污, 各奔东西]
    examples:
      - "真正的朋友会在困难时互相帮助，与彼此同甘共苦。"
      - "夫妻应该同甘共苦，一起面对生活中的困难。"
      - "他们一起创业多年，同甘共苦，建立了深厚的感情。"
      - "真正的伙伴不只是分享成功，也愿意同甘共苦。"
      - "在最困难的时候，是朋友们陪着我同甘共苦。"

  - chinese: 嬉戏
    pinyin: xī xì
    meaning: "play; frolic"
    confusables: [戏剧, 戏院, 嬉皮]
    examples:
      - "几个孩子在公园里快乐地嬉戏，脸上充满了笑容。"
      - "小朋友们在草地上嬉戏，玩得非常开心。"
      - "海边的孩子们在浅水中嬉戏。"
      - "小狗们在院子里互相追逐嬉戏。"
      - "放学后，孩子们常常在操场上嬉戏。"

  - chinese: 寻找
    pinyin: xún zhǎo
    meaning: "search for; look for"
    confusables: [寻常, 寻思, 寻仇]
    examples:
      - "警方和居民一起寻找那名在公园走失的孩子。"
      - "我正在寻找一本适合初学者阅读的中文书。"
      - "他花了一个小时寻找自己的钥匙。"
      - "我们应该主动寻找解决问题的方法。"
      - "游客们正在寻找一家附近的餐厅。"

  - chinese: 流逝
    pinyin: liú shì
    meaning: "pass; elapse"
    confusables: [流行, 逝世, 流浪]
    examples:
      - "随着时间不断流逝，我们更应该珍惜与家人相处的机会。"
      - "时间慢慢流逝，太阳也渐渐落下了。"
      - "青春一旦流逝，就无法重新回来。"
      - "随着岁月流逝，他对童年的记忆越来越模糊。"
      - "时间不断流逝，我们却还没有完成工作。"

  - chinese: 俏皮
    pinyin: qiào pí
    meaning: "playful; lively"
    confusables: [皮肤, 皮球]
    examples:
      - "妹妹说话时露出俏皮的笑容，把全家人都逗笑了。"
      - "小女孩做了一个俏皮的动作，大家都笑了起来。"
      - "她留着短发，看起来既可爱又俏皮。"
      - "孩子用俏皮的语气回答老师的问题。"
      - "这只小猫俏皮地跳到桌子上，引起了大家的注意。"

  - chinese: 承载
    pinyin: chéng zài
    meaning: "carry; bear; embody"
    confusables: [承认, 承诺]
    examples:
      - "这座老建筑承载着许多居民珍贵的童年回忆。"
      - "这本相册承载着我们一家人的美好回忆。"
      - "这座桥承载着每天来往的大量车辆。"
      - "传统节日承载着丰富的历史和文化。"
      - "父母对孩子的爱承载着他们对未来的希望。"

  - chinese: 翠绿
    pinyin: cuì lǜ
    meaning: "emerald green; lush green"
    confusables: [翠鸟, 绿灯]
    examples:
      - "雨后的山林一片翠绿，空气也变得格外清新。"
      - "春天来了，树上长出了翠绿的新叶。"
      - "远处的山被翠绿的森林覆盖着。"
      - "公园里的草地一片翠绿，看起来十分漂亮。"
      - "阳光照在翠绿的竹叶上，显得格外清新。"