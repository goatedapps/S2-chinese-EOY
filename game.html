<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>接词游戏 · Word Drop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="topnav">
  <a class="brand" href="index.html">
    <span class="brand-mark">词</span>
    <span class="brand-text">Vocab Practice</span>
  </a>
  <div class="nav-links">
    <a href="index.html" data-nav="home">Home</a>
    <a href="flashcards.html" data-nav="flashcards">Flashcards</a>
    <a href="game.html" data-nav="game">Game</a>
    <a href="fillblank.html" data-nav="fillblank">Fill Blank</a>
  </div>
</nav>

<main>
  <div class="stage-wrap">
    <p class="stage-hint">Catch as many words as you can in 20 seconds. Get one right and the next sentence appears right away.</p>

    <div id="emptyNote" class="empty-note hidden">No words selected — go back to Home and pick some words first.</div>

    <div id="startArea" class="stage-wrap">
      <button class="pill-btn primary" id="startBtn">Start game</button>
    </div>

    <div id="playArea" class="stage-wrap hidden">
      <div class="game-topbar">
        <div class="stat">
          <div class="val" id="scoreStat">0</div>
          <div class="lab">caught</div>
        </div>
        <div class="timer-ring">
          <svg viewBox="0 0 64 64">
            <circle class="track" cx="32" cy="32" r="27"></circle>
            <circle class="progress" id="timerCircle" cx="32" cy="32" r="27"></circle>
          </svg>
          <div class="time-num" id="timeNum">20</div>
        </div>
        <div class="stat">
          <div class="val" id="missStat">0</div>
          <div class="lab">missed</div>
        </div>
      </div>

      <div class="sentence-board cjk" id="sentenceBoard"></div>

      <div class="fall-zone" id="fallZone"></div>
    </div>

    <div id="summaryArea" class="summary hidden">
      <h2 class="cjk">时间到</h2>
      <div class="score-num" id="finalScore">0</div>
      <p class="stage-hint" id="finalSub">words caught</p>
      <div class="controls-row">
        <button class="pill-btn primary" id="playAgainBtn">Play again</button>
        <a class="pill-btn ghost" href="index.html">Back to home</a>
      </div>
    </div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/game.js"></script>
</body>
</html>
